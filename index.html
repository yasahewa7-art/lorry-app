<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolero Lorry AI Assistant - Sri Lanka</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { background: white; width: 100%; max-width: 450px; height: 520px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #28a745; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; }
        .message { padding: 10px 15px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 14px; }
        .bot-msg { background: #e2e2e2; color: #333; align-self: flex-start; }
        .user-msg { background: #28a745; color: white; align-self: flex-end; }
        .chat-input-area { display: flex; padding: 10px; background: white; border-top: 1px solid #ddd; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 14px; }
        .chat-input-area button { background: #28a745; color: white; border: none; padding: 10px 15px; margin-left: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Bolero Lorry AI Assistant 🚚</div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-msg">ආයුබෝවන්! මම Bolero ලොරි සේවයේ AI සහායකයායි. පඹුරුන ඔෆිස් සිට ඔබට යාමට අවශ්‍ය **ගමනාන්තය (නගරය හෝ ගම)** මෙහි ලියන්න.</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="ගමනාන්තය ලියන්න..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">යවන්න</button>
        </div>
    </div>

    <script>
        function appendMessage(text, sender, isLoading = false) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'bot-msg'}`;
            if (isLoading) msgDiv.id = 'loadingMsg';
            msgDiv.innerHTML = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function processAIQuery(userText) {
            appendMessage("මඳක් සිටින්න, දුර මනිමින් ගාස්තුව ගණනය කරමින් පවතී...", 'bot', true);

            try {
                const response = await fetch('http://localhost:3000/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destination: userText })
                });

                const data = await response.json();
                
                const loadingEl = document.getElementById('loadingMsg');
                if (loadingEl) loadingEl.remove();

                if (!data.success) {
                    appendMessage(data.message || "සමාවෙන්න, දෝෂයක් සිදු විය.", 'bot');
                    return;
                }

                let reply = `📍 **ගමනාන්තය:** ${data.destination} (${data.distance} km)<br>💰 **ඇස්තමේන්තුගත ගාණ:** LKR ${data.fare}.00<br><br>මෙම ගමන වෙන්කරවා ගැනීමට අවශ්‍ය නම් අමතන්න!`;
                appendMessage(reply, 'bot');

            } catch (error) {
                const loadingEl = document.getElementById('loadingMsg');
                if (loadingEl) loadingEl.remove();
                appendMessage("සර්වර් එක සමඟ සම්බන්ධ වීමට නොහැකි විය. කරුණාකර සර්වර් එක රන් කර ඇති බව තහවුරු කරන්න.", 'bot');
                console.error(error);
            }
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const userText = inputField.value.trim();

            if (!userText) return;

            appendMessage(userText, 'user');
            inputField.value = "";

            setTimeout(() => {
                processAIQuery(userText);
            }, 300);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
