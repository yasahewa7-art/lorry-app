<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolero Lorry Fare Calculator - Matara Pamburana</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 text-center shadow-md">
        <h1 class="text-xl font-bold">🚚 Bolero Lorry Fare Chatbot</h1>
        <p class="text-sm text-blue-200">මාතර පඹුරුන සිට ඕනෑම ප්‍රදේශයකට ගාස්තු ගණනය කිරීම</p>
    </header>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl mx-auto w-full">
        <div class="flex justify-start">
            <div class="bg-white p-3 rounded-lg shadow max-w-xs text-gray-800">
                ආයුබෝවන්! මාතර පඹුරුන සිට ඔබ යා යුතු ගමනාන්තය (නගරය හෝ ලිපිනය) මෙතැන ටයිප් කරන්න.
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="bg-white border-t p-4 shadow-lg">
        <form id="chat-form" class="flex max-w-2xl mx-auto gap-2">
            <input type="text" id="destination-input" placeholder="උදා: කොළඹ, ගාල්ල, וועලිගම..." 
                   class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600" required>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                යවන්න
            </button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const destinationInput = document.getElementById('destination-input');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const destination = destinationInput.value.trim();
            if (!destination) return;

            // User message add
            appendMessage(destination, 'user');
            destinationInput.value = '';

            // Loading message
            const loadingId = appendMessage('ගණනය කරමින් පවතී, කරුණාකර රැඳී සිටින්න...', 'bot');

            try {
                const response = await fetch('/api/calculate-fare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destination })
                });

                const data = await response.json();
                
                // Remove loading
                document.getElementById(loadingId).remove();

                if (data.success) {
                    appendMessage(data.result, 'bot');
                } else {
                    // සර්වර් එකෙන් එන නියම දෝෂය සහ විස්තරය මෙහි පෙන්වනු ඇත
                    const errorMsg = data.error || 'දෝෂයක් සිදු විය.';
                    const fullErrDetails = data.fullError ? `\n\nවිස්තරය: ${data.fullError}` : '';
                    appendMessage(`⚠️ දෝෂයකි: ${errorMsg}${fullErrDetails}`, 'bot');
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage('⚠️ සර්වර් එක සමඟ සම්බන්ධ වීමට නොහැකි විය: ' + err.message, 'bot');
            }
        });

        function appendMessage(text, sender) {
            const msgId = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.id = msgId;
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `p-3 rounded-lg shadow max-w-md whitespace-pre-line ${
                sender === 'user' ? 'bg-blue-600 text-white' : 'bg-white text-gray-800 border'
            }`;
            bubble.innerText = text;
            
            div.appendChild(bubble);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgId;
        }
    </script>
</body>
</html>
