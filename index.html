<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paburana Fare Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            margin-top: 25px;
            border: none;
            background: #111827;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #000;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f3f4f6;
            border-radius: 15px;
            display: none;
        }

        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚚 Fare Calculator</h1>

    <label>Starting Location</label>

    <input
        type="text"
        value="Paburana, Matara"
        readonly
    >

    <label>Destination</label>

    <input
        id="destination"
        type="text"
        placeholder="Example: Galle"
    >

    <label>Vehicle</label>

    <select id="vehicle">
        <option>Mahindra Bolero</option>
        <option>Dimo Batta</option>
        <option>Canter</option>
        <option>Canter 1618</option>
    </select>

    <button onclick="calculateFare()">
        Calculate Fare
    </button>

    <div id="result" class="result"></div>

    <div id="error" class="error"></div>

</div>

<script>

async function calculateFare() {

    const destination =
        document.getElementById("destination").value.trim();

    const vehicle =
        document.getElementById("vehicle").value;

    const result =
        document.getElementById("result");

    const error =
        document.getElementById("error");

    result.style.display = "none";
    error.innerText = "";

    if (!destination) {
        error.innerText =
            "කරුණාකර destination එක ඇතුළත් කරන්න.";
        return;
    }

    result.style.display = "block";
    result.innerHTML = "⏳ Calculating...";

    try {

        const response = await fetch(
            "/api/calculate-fare",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    destination: destination,
                    vehicle: vehicle
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error);
        }

        result.innerHTML = `
            <h2>Paburana → ${destination}</h2>
            <p><strong>Vehicle:</strong> ${vehicle}</p>
            <hr>
            <pre style="font-size:18px;white-space:pre-wrap">${data.result}</pre>
        `;

    } catch (err) {

        result.style.display = "none";

        error.innerText =
            "Error: " + err.message;
    }
}

</script>

</body>
</html>
